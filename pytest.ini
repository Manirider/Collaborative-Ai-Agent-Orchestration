[pytest]
asyncio_mode = auto
markers =
    integration: mark test as requiring external infrastructure (db, redis, celery)
filterwarnings =
    ignore:'asyncio\.iscoroutinefunction' is deprecated:DeprecationWarning:pytest_asyncio
    ignore:'asyncio\.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio
    ignore:'asyncio\.set_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio
    ignore:'asyncio\.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi
    ignore:'asyncio\.iscoroutinefunction' is deprecated:DeprecationWarning:starlette
